---
export_dir: /export

jupyterhub_username: jupyterhub
jupyterhub_password: random

# jupyterhub_service_user: root
jupyterhub_service_user: jupyterhub

# Dependencies variables
wheel_version: 0.45.1
jupyterhub_version: 5.2.1
jupyterlab_version: 4.3.4
notebook_version: 7.3.2
markupsafe_version: 3.0.2
ipywidgets_version: 8.1.5

# Jupyterhub configuration variables
jupyterhub_virtualenv: "{{ export_dir }}/jupyterhub"
jupyterhub_virtualenv_bin: "{{ jupyterhub_virtualenv }}/bin"
jupyterhub_config_dir: "{{ jupyterhub_virtualenv }}/etc/jupyterhub"
jupyterhub_config_file: "{{ jupyterhub_config_dir }}/jupyterhub_config.py"
jupyterhub_log_dir: "/var/log/jupyterhub"
jupyterhub_allow_sudo: false
admin_users:
  - "{{ jupyterhub_username }}"
notebooks_dir: "{{ export_dir }}/notebooks"

# Conda variables
conda_gpg_key_url: https://repo.anaconda.com/pkgs/misc/gpgkeys/anaconda.asc
conda_repo: deb [arch=amd64] https://repo.anaconda.com/pkgs/misc/debrepo/conda stable main
conda_dir: "/opt/conda"
conda_script_path: /etc/profile.d/conda.sh
conda_envs_dir: "{{ export_dir }}/conda_envs"
default_conda_env_name: default
default_conda_env_dir: "{{ conda_envs_dir }}/{{ default_conda_env_name }}"
default_conda_env_packages:
  - ipykernel
python_version: 3.10.6

# Nginx variables
jupyterhub_relative_url: /jupyter
nginx_conf_dir: /etc/nginx
jupyterhub_nginx_enable: true
jupyterhub_nginx_site_file: jupyterhub
jupyterhub_nginx_template: jupyterhub_nginx.j2

# For extra system packages dependencies that may be needed for python modules
jupyter_extra_pkgs: []
#  - python-dev
#  - cargo

jupyter_extra_pip: []
#  - oauthenticator
#  - git+https://github.com/KamalGalrani/jupyterhub-nativespawner.git
#  - jupyterhub-systemdspawner

# This will prevent any new pip module install or network access unless proxy available in below range
jupyterhub_systemd_ipaddressallow: 'localhost link-local multicast 10.0.0.0/8 192.168.0.0/16'

# Test variables
role_debug: false
is_container: false
