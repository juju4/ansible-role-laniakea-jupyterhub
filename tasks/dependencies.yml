---

- name: Install dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - nodejs
    - npm
    - python3-pip
    - python3-virtualenv
    - systemd
    - "{{ jupyter_extra_pkgs }}"

- name: Ensure python virtualenv dir is writable
  ansible.builtin.file:
    path: "{{ jupyterhub_virtualenv }}"
    state: directory
    mode: '0755'
    owner: "{{ jupyterhub_service_user }}"
  when:
    - jupyterhub_service_user != 'root'

- name: Create python virtualenv with required dependencies
  ansible.builtin.pip:
    name:
      - wheel=={{ wheel_version }}
      - jupyterlab=={{ jupyterlab_version }}
      - jupyterhub=={{ jupyterhub_version }}
      - notebook=={{ notebook_version }}
      # https://techoverflow.net/2022/04/07/how-to-fix-jupyter-lab-importerror-cannot-import-name-soft_unicode-from-markupsafe/
      - markupsafe=={{ markupsafe_version }}
      - ipywidgets=={{ ipywidgets_version }}
    virtualenv: "{{ jupyterhub_virtualenv }}"
  become: true
  become_user: "{{ jupyterhub_service_user }}"

- name: Conditional python virtualenv dependencies - non-root
  ansible.builtin.pip:
    name:
      - jupyterhub-systemdspawner
    virtualenv: "{{ jupyterhub_virtualenv }}"
  become: true
  become_user: "{{ jupyterhub_service_user }}"
  when:
    - jupyterhub_service_user != 'root'

- name: Set permissions for python virtualenv
  ansible.builtin.file:
    path: "{{ jupyterhub_virtualenv }}"
    state: directory
    mode: '0755'
    recurse: true
    owner: "{{ jupyterhub_username }}"
    group: "{{ jupyterhub_username }}"

- name: Install configurable-http-proxy with npm
  community.general.npm:
    name: configurable-http-proxy
    global: true
