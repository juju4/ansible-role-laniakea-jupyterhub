---

- name: Set fact is_container
  ansible.builtin.set_fact:
    is_container: true
  when: >
    (ansible_virtualization_type is defined and
      (ansible_virtualization_type == "docker"
       or ansible_virtualization_type == "containerd"
       or ansible_virtualization_type == "container"
      )
    )

- name: Create JupyterHub user
  ansible.builtin.include_tasks: jupyterhub_user.yml

- name: Install dependencies
  ansible.builtin.include_tasks: dependencies.yml

- name: Configure JupyterHub
  ansible.builtin.include_tasks: configuration.yml

- name: Create JupyterHub service
  ansible.builtin.include_tasks: systemd.yml

- name: Install and configure conda
  ansible.builtin.include_tasks: conda.yml

- name: Install and configure nginx
  ansible.builtin.include_tasks: nginx.yml
  when:
    - jupyterhub_nginx_enable | bool
